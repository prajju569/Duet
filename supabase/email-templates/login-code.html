<!-- Duet login email. Paste into Supabase → Authentication → Emails → "Magic Link" AND "Confirm signup".
     Subject: Your Duet code: {{ .Token }} -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>Your Duet code</title>
</head>
<body style="margin:0;padding:0;background-color:#120c10;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">Your code is {{ .Token }}. Your room is waiting 🎧</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#120c10;background-image:radial-gradient(60% 40% at 15% 0%,#5a1f33 0%,rgba(18,12,16,0) 70%),radial-gradient(50% 35% at 100% 15%,#5c2f1c 0%,rgba(18,12,16,0) 70%);">
  <tr>
    <td align="center" style="padding:48px 20px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px;">

        <!-- Logo -->
        <tr>
          <td align="center" style="padding-bottom:28px;">
            <span style="font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:40px;line-height:1;color:#fbf1ea;letter-spacing:-0.5px;">Duet</span>
            <div style="font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#fbf1ea;opacity:0.45;padding-top:8px;">a room for two</div>
          </td>
        </tr>

        <!-- Card -->
        <tr>
          <td style="background-color:#1d1419;border:1px solid #33242c;border-radius:28px;padding:40px 28px 36px;" align="center">
            <div style="font-size:34px;line-height:1;padding-bottom:18px;">🎧</div>
            <div style="font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:24px;line-height:1.3;color:#fbf1ea;padding-bottom:8px;">Your room is waiting</div>
            <div style="font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;color:#c9b8b0;padding-bottom:28px;">Type this code in Duet to sign in.</div>

            <!-- Code -->
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" style="background-color:#fbf1ea;background-image:linear-gradient(135deg,#fecdd3 0%,#fed7aa 100%);border-radius:20px;padding:18px 16px 18px 26px;">
                  <span style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:36px;font-weight:700;letter-spacing:10px;color:#120c10;">{{ .Token }}</span>
                </td>
              </tr>
            </table>

            <div style="font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:12px;color:#8f7f79;padding-top:14px;">Expires in 1 hour · only works once</div>

            <!-- Divider -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:30px 0 22px;">
              <tr><td style="border-top:1px solid #33242c;font-size:0;line-height:0;">&nbsp;</td></tr>
            </table>

            <div style="font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:13px;color:#8f7f79;padding-bottom:14px;">On the same phone? Skip the typing:</div>
            <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:14px;font-weight:600;color:#fbf1ea;text-decoration:none;border:1px solid #4a3540;border-radius:999px;padding:12px 26px;">Tap to sign in →</a>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td align="center" style="padding-top:26px;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#6f615c;">
            Didn't ask for this? You can safely ignore it.<br>
            Made with ♥ for two.
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
